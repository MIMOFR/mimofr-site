<script>
  // Track outbound clicks (gtag/fbq safe-call)
  function track(platform) {
    try {
      if (window.gtag) gtag('event', 'beholder_click', { platform: platform });
      if (window.fbq) fbq('trackCustom', 'BeholderClick', { platform: platform });
    } catch (e) {}
  }

  // Background audio: autoplay, with first-interaction fallback for browsers that block it
  (function () {
    const audio = document.getElementById('bg-audio');
    const btn = document.getElementById('audio-toggle');
    const iconMuted = document.getElementById('icon-muted');
    const iconPlaying = document.getElementById('icon-playing');

    audio.volume = 0.55;
    let playing = false;

    function setPlaying(state) {
      playing = state;
      iconMuted.style.display = state ? 'none' : 'block';
      iconPlaying.style.display = state ? 'block' : 'none';
      if (state) btn.classList.remove('pulse');
      btn.setAttribute('aria-label', state ? 'mute background audio' : 'play background audio');
      btn.querySelector('.label').textContent = state ? 'mute' : 'tap to hear';
    }

    function tryPlay() {
      return audio.play()
        .then(() => { setPlaying(true); return true; })
        .catch(() => false);
    }

    // 1) Attempt immediate autoplay
    tryPlay();

    // 2) If autoplay was blocked, the first ANY interaction triggers play
    const events = ['pointerdown', 'click', 'keydown', 'touchstart', 'scroll'];
    function onFirstInteraction() {
      if (playing) { cleanup(); return; }
      tryPlay().then((ok) => { if (ok) cleanup(); });
    }
    function cleanup() {
      events.forEach(e => window.removeEventListener(e, onFirstInteraction, { passive: true }));
    }
    events.forEach(e => window.addEventListener(e, onFirstInteraction, { passive: true, once: false }));

    // 3) Explicit toggle button
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!playing) {
        tryPlay();
      } else {
        audio.pause();
        setPlaying(false);
      }
    });

    // Stop pulse after 6s regardless
    setTimeout(() => btn.classList.remove('pulse'), 6000);

    // Reflect actual audio state if it starts playing for any reason
    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
  })();
